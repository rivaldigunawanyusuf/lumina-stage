<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" fill="none">
  <!-- Minimalist Dark Studio Slate Card -->
  <rect width="920" height="220" rx="36" fill="#0B0B0C" stroke="#27272A" stroke-width="2" />

  <!-- Vector Diamond Aperture Emblem on Studio Pedestal -->
  <g transform="translate(48, 38)">
    <rect width="144" height="144" rx="36" fill="#18181B" stroke="#3F3F46" stroke-width="2" />
    <g transform="translate(72, 72) scale(3.2)">
      <path d="M-8.5 3 L8.5 3 L12 7 L-12 7 Z" fill="#FFFFFF" />
      <path d="M0 -13 L11.5 -1.5 L0 10 L-11.5 -1.5 Z" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="miter" />
    </g>
  </g>

  <!-- Brand Typography: LUMINA STAGE -->
  <text x="228" y="114" fill="#F4F4F5" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Plus Jakarta Sans', sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
    LUMINA<tspan fill="#A1A1AA" font-weight="300" letter-spacing="4">STAGE</tspan>
  </text>

  <!-- Subheadline -->
  <text x="232" y="154" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="600" letter-spacing="2.5">
    COMMERCIAL AI PRODUCT PHOTOGRAPHY &amp; AD STUDIO
  </text>

  <!-- Studio Status Badge -->
  <rect x="714" y="64" width="158" height="36" rx="18" fill="#18181B" stroke="#3F3F46" stroke-width="1.5" />
  <circle cx="736" cy="82" r="4" fill="#10B981" />
  <text x="750" y="87" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="700" letter-spacing="1">
    STUDIO PRO
  </text>
</svg>
